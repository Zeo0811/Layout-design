<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十字路口排版专用</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
@font-face{font-family:'可画大丰收SC';src:url('../assets/fonts/可画大丰收SC.ttf') format('truetype');font-display:swap;}
@font-face{font-family:'HarmonyOS Sans SC';font-weight:400;src:url('../assets/fonts/HarmonyOS_Sans_SC_Regular.ttf') format('truetype');}
@font-face{font-family:'HarmonyOS Sans SC';font-weight:700;src:url('../assets/fonts/HarmonyOS_Sans_SC_Bold.ttf') format('truetype');}
  </style>
</head>
<body>
  <div class="app">

    <!-- 顶部 Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">
          <img src="../icons/icon48.png" width="28" height="28" alt="logo" />
        </span>
        <div>
          <div class="app-name">十字路口排版</div>
          <div id="appSub" class="app-sub">Notion / 飞书 → 微信公众号</div>
        </div>
      </div>
      <span id="badge" class="badge badge--unknown">检测中...</span>
      <button id="recoSetupBtn" class="btn-reco-setup" title="配置推荐阅读服务">⚙</button>
    </header>

    <!-- 排版模板选择（微信模式下隐藏） -->
    <div id="template-row" class="template-row">
      <span class="template-label">排版模板</span>
      <select id="templateSelect" class="template-select">
        <option value="">默认样式</option>
      </select>
      <button id="syncBtn" class="btn-sync" title="从服务器同步模板">↻ 同步</button>
    </div>

    <!-- 状态提示（Notion/飞书模式用） -->
    <div id="statusBar" class="status-bar status-bar--hidden">
      <span id="statusIcon" class="status-icon">⏳</span>
      <span id="statusText">处理中...</span>
    </div>

    <!-- ── Notion / 飞书 转换模式 ── -->
    <div id="convert-panel">
      <!-- 输出目标切换（仅 Notion 页面显示飞书选项） -->
      <div id="targetRow" class="target-row">
        <span class="target-label">输出目标</span>
        <div class="target-toggle">
          <button id="targetWechat" class="target-btn target-btn--active" data-target="wechat">微信公众号</button>
          <button id="targetFeishu" class="target-btn" data-target="feishu">飞书文档</button>
        </div>
      </div>
      <div class="toolbar">
        <button id="convertBtn" class="btn btn--primary">
          <span class="btn-icon">⚡</span>
          一键转换
        </button>
        <button id="copyBtn" class="btn btn--secondary" disabled>
          <span class="btn-icon">📋</span>
          完整复制
        </button>
      </div>
      <!-- 推荐阅读：转换后从 zeooo.cc 拉候选，选完才解锁复制 -->
      <div id="recoPanel" class="reco-panel hidden">
        <div class="reco-head">
          <span id="recoHint">正在查找相关文章…</span>
          <button id="recoToggleAll" class="btn-reco-link hidden">全选</button>
        </div>
        <div id="recoList" class="reco-list"></div>
        <div id="recoFoot" class="reco-foot hidden">
          <button id="recoSkipBtn" class="btn btn--secondary btn--sm">不加推荐</button>
          <button id="recoConfirmBtn" class="btn btn--primary btn--sm">确认并生成</button>
        </div>
      </div>

      <div id="segmentRow" class="segment-row hidden">
        <span class="segment-label">分段复制：</span>
        <div id="segmentBtns" class="segment-btns"></div>
      </div>
      <div class="preview-panel">
        <div class="preview-header">
          <span class="preview-title">预览</span>
          <span id="stats" class="preview-stats"></span>
        </div>
        <div id="preview" class="preview-body">
          <div class="empty-state">
            <div class="empty-icon">📄</div>
            <div class="empty-text">打开 Notion 或飞书文章页面<br>点击「一键转换」开始处理</div>
          </div>
        </div>
      </div>
      <div id="imageNote" class="image-note hidden">
        <span class="image-note-icon">🖼</span>
        <span id="imageNoteText">图片已转 Base64，可离线显示</span>
      </div>
    </div>

    <!-- 推荐阅读服务配置 -->
    <div id="recoSetup" class="reco-setup hidden">
      <div class="reco-setup-title">推荐阅读服务</div>
      <p class="reco-setup-desc">
        填入 zeooo.cc 的插件密钥后，转换完会自动推荐相关的历史文章。
        留空则关闭该功能，排版流程不受影响。
      </p>
      <input type="password" id="recoKeyInput" class="wechat-name-input" placeholder="X-Extension-Key" autocomplete="off">
      <div class="reco-setup-foot">
        <button id="recoKeySave" class="btn btn--primary btn--sm">保存</button>
        <button id="recoKeyClear" class="btn btn--secondary btn--sm">清除</button>
        <button id="recoKeyClose" class="btn btn--secondary btn--sm">关闭</button>
      </div>
      <div id="recoSetupMsg" class="reco-setup-msg"></div>
    </div>

    <!-- ── 微信公众号排版提取模式 ── -->
    <div id="wechat-panel" class="wechat-panel hidden">

      <!-- Step 1：手动选择元素 -->
      <div id="wechat-step1" class="wechat-step">
        <div class="wechat-hero">
          <div class="wechat-hero-icon">🎨</div>
          <div class="wechat-hero-title">手动选取排版风格</div>
          <div class="wechat-hero-desc">进入选择模式，点击文章中的元素，<br>通过下拉菜单指定其样式类型</div>
        </div>
        <button id="selectModeBtn" class="btn btn--extract">
          <span class="btn-icon">🖱</span>
          进入选择模式
        </button>
        <div id="mini-selected-list" class="mini-selected-list"></div>
        <button id="toSaveBtn" class="btn btn--primary hidden">
          <span class="btn-icon">→</span>
          下一步：命名保存
        </button>
      </div>

      <!-- Step 2：提取结果 + 命名保存 -->
      <div id="wechat-step2" class="wechat-step hidden">
        <div class="results-header">
          <span class="results-title">提取结果</span>
          <button id="reExtractBtn" class="btn-reextract">↺ 重新选择</button>
        </div>
        <div id="results-list" class="results-list"></div>
        <div class="wechat-save-form">
          <input id="wechat-tpl-name" class="wechat-name-input"
                 type="text" placeholder="输入模板名称（如：新榜风格）" />
          <button id="saveExtractBtn" class="btn btn--extract">
            <span class="btn-icon">💾</span>
            保存为模板
          </button>
        </div>
      </div>

    </div><!-- /wechat-panel -->

  </div>

  <script src="highlight.min.js"></script>
  <script src="green-style.js"></script>
  <script src="formatter.js"></script>
  <script src="formatter-green.js"></script>
  <script src="formatter-feishu.js"></script>
  <script src="popup.js"></script>
</body>
</html>
